# Your insidejob config: which job boards to watch and which jobs to alert on.
#
# This is a working starter (a few tech companies in Finland). Replace the companies and
# filters with your own. config.example.yaml explains every option, including `rank:`
# for your cities, interests and start date. Check changes with:
#   uv run insidejob run --dry-run

filters:
  # The job title must match (regex, any case). \b keeps "intern" from matching "Internal".
  # The Finnish words catch kesätyö, harjoittelija, opinnäytetyö and diplomityö.
  title: '\b(interns?|internships?|trainees?|traineeship|summer|thesis|graduates?|junior|entry[- ]level|working student|apprentice(ship)?)\b|kesä|harjoittel|opinnäyte|diplomityö'
  # ...and must not match.
  exclude: '\b(senior|sr|lead|principal|staff|director|manager|head of|vp|vice president|chief)\b'
  # Location must match. Jobs with an empty location pass. "Remote" alone isn't listed,
  # so "Remote - United States" stays out while "Remote - EMEA" gets in.
  location: 'finland|suomi|helsinki|espoo|vantaa|\b(eu|europe|emea|nordics?)\b'

sources:
  - { company: Wolt, type: greenhouse, board: wolt }
  - { company: Smartly, type: greenhouse, board: smartlyio }
  - { company: ICEYE, type: ashby, board: iceye }
  - { company: Supercell, type: ashby, board: supercell }
  - { company: Reaktor, type: ashby, board: reaktor }
  - { company: Nitor, type: workable, board: nitor }
  - { company: Futurice, type: rss, board: careers.futurice.com/jobs.rss }

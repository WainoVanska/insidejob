# Your insidejob settings. Edit them right here on GitHub (the pencil icon), then
# "Commit changes". The "Check config" action then shows the companies, how many jobs
# match and your top 5, under Actions → Check config → Summary. Nothing is sent.
#
# Lines starting with # are notes and are ignored. config.example.yaml explains every
# option, including the advanced ones.

# ── What you're looking for ───────────────────────────────────────────────────────
looking_for:
  # Which jobs count. Remove the ones you don't want. Senior roles are always left out.
  roles: [intern, thesis, junior, graduate]
  # Where. Jobs in these cities rank highest, then the country, then remote.
  cities: [Helsinki, Espoo, Vantaa]
  country: Finland
  # true = remote jobs within Europe count too; anywhere = any remote job; false = none.
  remote: true
  # What you like, in plain words. Built in: graphics, AI, games, web, mobile, backend,
  # software, data, cloud, embedded, security, design, marketing, sales, finance, hr,
  # research, robotics. Any other word is matched as written (e.g. Rust, fintech).
  interests: [software, web]
  # When you can start: a season or month, e.g. summer 2027, autumn 2027, June 2027.
  # Delete the line if any time is fine.
  start: summer 2027

# ── Companies to watch ────────────────────────────────────────────────────────────
# A preset is a ready-made list: fi-software = 21 Finnish software and games companies
# (see presets/fi-software.yaml). Remove the line to pick every company yourself.
#
# Add your own: paste the link of any job ad (or the job list) from a company's careers
# page. Works with Greenhouse, Ashby, Workable and Teamtailor, and job feeds ending in
# .rss. Write "Name: link" to choose the name shown in alerts. A company that's already
# in the preset is simply watched once.
companies:
  - preset: fi-software
  # - "Acme: https://job-boards.greenhouse.io/acme"

name: Get updates

# For copies of the template: once a week, merge the public insidejob repo's latest code
# into a `sync/upstream` branch and open a pull request. You review and merge it; CI runs
# on it first. Your config.yaml is never changed. If the merge conflicts, an issue explains
# how to update by hand instead.
#
# Needs a SYNC_TOKEN secret: GitHub's built-in token may not push changes to workflow
# files, and updates often include them. Without the secret this skips with a notice.
# See README: Get updates.
on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC, after the weekly check-in
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: insidejob-sync
  cancel-in-progress: false

jobs:
  sync:
    # Not in the public repo itself: it is the upstream.
    if: github.repository != 'WainoVanska/insidejob'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check for SYNC_TOKEN
        id: token
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -n "$SYNC_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::SYNC_TOKEN secret not set, skipping. See README: Get updates."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.token.outputs.ready == 'true'
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Merge upstream
        id: merge
        if: steps.token.outputs.ready == 'true'
        run: echo "result=$(bash .github/scripts/sync-upstream.sh | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Open or update the pull request
        if: steps.merge.outputs.result == 'ready'
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          git push --force --quiet origin sync/upstream
          if [ -z "$(gh pr list --head sync/upstream --state open --json number -q '.[].number')" ]; then
            gh pr create --head sync/upstream --base main \
              --title "Update from insidejob" \
              --body "The latest code from [insidejob](https://github.com/WainoVanska/insidejob). Your \`config.yaml\` is unchanged. Merge when CI is green. This PR updates itself until you merge it."
          else
            echo "Pull request already open: updated its branch."
          fi

      - name: Report a conflict
        if: steps.merge.outputs.result == 'conflict'
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          title="Update from insidejob needs a hand"
          if [ -n "$(gh issue list --state open --search "in:title \"$title\"" --json number -q '.[].number')" ]; then
            echo "Conflict issue already open."
            exit 0
          fi
          gh issue create --title "$title" --body "The latest insidejob code conflicts with changes in this copy, so no pull request was opened. On your computer:

          \`\`\`sh
          git remote add upstream https://github.com/WainoVanska/insidejob.git
          git pull upstream main     # fix the conflicts it lists, then commit
          git push
          \`\`\`

          Close this issue when done; the next weekly sync will be automatic again."

name: Check for new jobs

on:
  schedule:
    # Hourly on weekdays, 04-18 UTC = about 06-20 Finnish time (07-21 in summer).
    # GitHub may start scheduled runs 5-30 minutes late.
    - cron: "0 4-18 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write # push the updated seen.json to the `state` branch

# Never run two at once: both would read the same state and race to push it.
concurrency:
  group: insidejob-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # State lives on its own orphan branch so `main` only has code commits.
      - name: Check out state branch
        uses: actions/checkout@v4
        with:
          ref: state
          path: state

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked --no-dev

      - name: Run insidejob
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: uv run --no-sync insidejob run --config config.yaml --state state/seen.json

      # Runs even if a source failed (exit 1): the other sources' state must still be
      # saved. The job itself stays failed, so GitHub emails about the failure.
      - name: Save state
        if: ${{ !cancelled() && hashFiles('state/seen.json') != '' }}
        working-directory: state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          if git diff --cached --quiet; then
            echo "State unchanged, nothing to commit."
          else
            git commit -m "state: update $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

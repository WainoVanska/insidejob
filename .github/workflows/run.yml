name: Check for new jobs

on:
  schedule:
    # Hourly on weekdays, 04-18 UTC = about 06-20 Finnish time (07-21 in summer).
    # GitHub may start scheduled runs 5-30 minutes late.
    - cron: "0 4-18 * * 1-5"
    # Weekly heartbeat: Monday 05:30 UTC = 07:30 Finnish time (08:30 in summer). A normal
    # run that also posts a "still alive" summary, so a quiet channel means "nothing new",
    # not "broken". Must match the schedule check in the run step.
    - cron: "30 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write # push the updated seen.json to the `state` branch

# Never run two at once: both would read the same state and race to push it.
concurrency:
  group: insidejob-run
  cancel-in-progress: false

jobs:
  # A fresh copy of the template has no webhook yet: skip quietly instead of failing
  # every hour. Secrets can't be used in a job's `if:`, hence this tiny job.
  setup:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::DISCORD_WEBHOOK_URL secret not set, skipping. See README: Use it yourself."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  run:
    needs: setup
    if: needs.setup.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # State lives on its own orphan branch so `main` only has code commits. A new copy
      # of the template doesn't have one yet: the first run creates it.
      - name: Check out state branch (create it on the first run)
        run: |
          if git ls-remote --exit-code --heads origin state > /dev/null; then
            git fetch --depth=1 origin state
            git worktree add -B state state FETCH_HEAD
          else
            echo "No state branch yet: creating it. This first run only records the jobs already up."
            git worktree add --detach state
            git -C state switch --orphan state
          fi

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked --no-dev

      - name: Run insidejob
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          HEARTBEAT: ${{ github.event.schedule == '30 5 * * 1' && '--heartbeat' || '' }}
        run: uv run --no-sync insidejob run --config config.yaml --state state/seen.json $HEARTBEAT

      # Runs even if a source failed (exit 1): the other sources' state must still be
      # saved. The job itself stays failed, so GitHub emails about the failure.
      - name: Save state
        if: ${{ !cancelled() && hashFiles('state/seen.json') != '' }}
        working-directory: state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json health.json
          if git diff --cached --quiet; then
            echo "State unchanged, nothing to commit."
          else
            git commit -m "state: update $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin HEAD:refs/heads/state
          fi

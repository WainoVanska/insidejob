# Weekly update pull requests for the Actions in .github/workflows and for the Python
# dependencies in uv.lock. CI runs on each one, so a breaking update shows up red.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
